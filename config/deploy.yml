# Deployed to the homelab the same way as egot-tracker: Kamal -> ghcr.io -> homelab,
# with a Cloudflare tunnel in front. See README for the one-time tunnel route.
service: end-credits

image: kquizz/end-credits

servers:
  web:
    hosts:
      - 192.168.50.220

proxy:
  ssl: false   # Cloudflare terminates HTTPS; the tunnel speaks plain HTTP to us
  host: credits.kquizz.com   # add this route in the Cloudflare tunnel dashboard

registry:
  server: ghcr.io
  username: kquizz
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - TMDB_API_KEY
  clear:
    # Run the Solid Queue supervisor inside the web server's Puma process.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite databases (primary, cache, queue, cable) live here and persist across deploys.
volumes:
  - "end_credits_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: kquizz
